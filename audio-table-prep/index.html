<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TSV Processor</title>
<style>
  body { font-family: Arial; margin: 20px; }
  textarea { width: 100%; height: 200px; }
  table { border-collapse: collapse; margin-top: 20px; }
  td { border: 1px solid #999; padding: 6px 10px; }
  button { margin-right: 10px; }
</style>
</head>
<body>

<h2>TSV Processor</h2>

<textarea id="input" placeholder="Paste TSV data here...">singleword	wordy words	category</textarea>
<br><br>

<div>
  <label><input type="radio" name="parenMode" value="end" checked> remove last () at end</label>
  <label><input type="radio" name="parenMode" value="all"> remove all ()</label>
  <label><input type="radio" name="parenMode" value="none"> keep ()</label>
</div>

<button onclick="processTSV()">Convert</button>
<button onclick="copyTSV()">Copy TSV</button>

<div id="output"></div>

<script>
let currentTableData = [];

// parenthesis modes: "end" (default), "all", "none"
function handleParentheses(text) {
    const mode = document.querySelector('input[name="parenMode"]:checked').value;

    if (mode === "all") {
        // remove all parentheses AND their content
        return text.replace(/\([^)]*\)/g, "").trim();
    }

    if (mode === "end") {
        // remove last parentheses at end INCLUDING content
        return text.replace(/\s*\([^)]*\)\s*$/g, "").trim();
    }

    return text;
}

function conv(text) {
    text = handleParentheses(text);

    let cleaned = text
        .toLowerCase()
        // replace colon with underscore so 12:30 becomes 12_30
        .replace(/[:\/]/g, " ")
        // keep unicode letters, digits, space, hyphen, underscore
        .replace(/[^\p{L}\d\-\s_]/gu, "")
        .trim();

    if (cleaned.length <= 40) {
        return cleaned.replace(/\s+/gu, "_");
    }

    let words = [];
    let regex = /\S+/gu;
    let match;

    while ((match = regex.exec(cleaned)) !== null) {
        words.push({
            word: match[0],
            start: match.index
        });
    }

    let kept = words.filter(w => w.start < 40);
    let result = kept.map(w => w.word).join(" ");

    return result.replace(/\s+/gu, "_");
}

function processTSV() {
    const input = document.getElementById("input").value.trim();
    const lines = input.split("\n");

    let html = "<table>";
    currentTableData = [];

    lines.forEach(line => {
        if (!line.trim()) return;

        const cols = line.split("\t");
        const A = cols[0] || "";
        const B = cols[1] || "";
        const C = cols[2] || "";

        const convA = conv(A);
        const convB = conv(B);

        const D = C + "-" + convA;
        const E = C + "-" + convA + "-" + convB;

        const F = A + "[sound:" + D + ".mp3]";
        const G = B + "[sound:" + E + ".mp3]";

        currentTableData.push([A, B, C, D, E, F, G]);

        html += "<tr>";
        html += `<td>${A}</td>`;
        html += `<td>${B}</td>`;
        html += `<td>${C}</td>`;
        html += `<td>${D}</td>`;
        html += `<td>${E}</td>`;
        html += `<td>${F}</td>`;
        html += `<td>${G}</td>`;
        html += "</tr>";
    });

    html += "</table>";
    document.getElementById("output").innerHTML = html;
}

function copyTSV() {
    if (!currentTableData.length) return;

    const tsv = currentTableData
        .map(row => row.join("\t"))
        .join("\n");

    navigator.clipboard.writeText(tsv).then(() => {
        alert("Copied as TSV!");
    });
}
</script>

</body>
</html>
